name: check-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml==6.0.3
      - run: python3 scripts/check-skills.py
      - run: python3 -m unittest scripts/test_check_skills.py
